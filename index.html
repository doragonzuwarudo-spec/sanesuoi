<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ツールボックス (画像・動画生成 & チャット)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 15px;
            background-color: #f4f6f9;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
            color: #222;
        }

        /* タブ切替ナビゲーション */
        .tab-container {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            color: #666;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #007bff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 各セクション表示切り替え */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* 入力フォーム共通 */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button.action-btn {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        button.action-btn:hover {
            background-color: #0056b3;
        }
        button.action-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* メディアプレビュー共通スタイリング */
        .download-btn {
            background-color: #28a745;
            margin-top: 15px;
            width: 100%;
            display: none;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        .media-container {
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ddd;
            position: relative;
        }
        .preview-media {
            width: 100%;
            height: auto;
            display: none;
        }
        .loading-text {
            display: none;
            font-weight: bold;
            color: #555;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }
        .loading-text.error-text {
            color: #dc3545;
        }

        /* チャットエリアスタイリング */
        #chat-box {
            height: 380px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            align-self: flex-start;
            background-color: #f1f3f5;
            color: #333;
            border-bottom-left-radius: 2px;
            border: 1px solid #e9ecef;
        }
        .message.system-error {
            align-self: center;
            background-color: #ffe3e3;
            color: #dc3545;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>AI ツールボックス</h1>

    <!-- タブメニュー -->
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('image-tab', event)">🎨 画像生成</button>
        <button class="tab-btn" onclick="switchTab('video-tab', event)">🎥 動画生成</button>
        <button class="tab-btn" onclick="switchTab('chat-tab', event)">💬 AIチャット</button>
    </div>

    <!-- 画像生成セクション -->
    <div id="image-tab" class="tab-content active">
        <div class="input-group">
            <input type="text" id="prompt" placeholder="生成したい画像の説明を入力..." value="サンズ Sans Undertale">
            <button id="generate-btn" class="action-btn" onclick="generateImage()">生成</button>
        </div>

        <div class="media-container">
            <div id="loading-img" class="loading-text">画像を生成中...（数秒かかります）</div>
            <img id="result-image" class="preview-media" alt="生成された画像" crossorigin="anonymous">
        </div>

        <button id="download-btn" class="action-btn download-btn" onclick="downloadMedia('result-image', 'ai-image', 'jpg')">画像を保存する</button>
    </div>

    <!-- 動画生成セクション -->
    <div id="video-tab" class="tab-content">
        <div class="input-group">
            <input type="text" id="video-prompt" placeholder="生成したい動画の説明（日本語可）..." value="サンズ Sans Undertale animation">
            <button id="generate-video-btn" class="action-btn" onclick="generateVideo()">生成</button>
        </div>

        <div class="media-container">
            <div id="loading-video" class="loading-text">動画を生成中...<br>（15秒〜30秒ほどかかる場合があります）</div>
            <video id="result-video" class="preview-media" controls autoplay loop muted playsinline crossorigin="anonymous"></video>
            <img id="result-video-img" class="preview-media" alt="生成された動画像" crossorigin="anonymous">
        </div>

        <button id="download-video-btn" class="action-btn download-btn" onclick="downloadVideoHandler()">動画を保存する</button>
    </div>

    <!-- AIチャットセクション -->
    <div id="chat-tab" class="tab-content">
        <div id="chat-box">
            <div class="message bot">こんにちは！質問や相談など何でも話しかけてください。</div>
        </div>

        <div class="input-group">
            <input type="text" id="chat-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" class="action-btn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        // タブ切り替え処理
        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        // 簡易英語プロンプト補助（日本語入力を英語キーワードに補正）
        function translateOrEnhancePrompt(text) {
            if (/[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\uff00-\uffef\u4e00-\u9faf]/.test(text)) {
                // 日本語が含まれている場合の補正処理例
                if (text.includes("サンズ")) {
                    return text.replace(/サンズ/g, "Sans Undertale character") + ", animated, detailed";
                }
                return text + ", highly detailed, animated";
            }
            return text;
        }

        // ================= 画像生成機能 =================
        function generateImage() {
            const promptInput = document.getElementById('prompt');
            const promptText = promptInput.value.trim();
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const loadingText = document.getElementById('loading-img');
            const resultImg = document.getElementById('result-image');

            if (!promptText) {
                alert('プロンプトを入力してください。');
                return;
            }

            generateBtn.disabled = true;
            resultImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loadingText.classList.remove('error-text');
            loadingText.textContent = '画像を生成中...（数秒かかります）';
            loadingText.style.display = 'block';

            const enhancedPrompt = translateOrEnhancePrompt(promptText);
            const encodedPrompt = encodeURIComponent(enhancedPrompt);
            const randomSeed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${randomSeed}`;

            resultImg.onload = function() {
                loadingText.style.display = 'none';
                resultImg.style.display = 'block';
                downloadBtn.style.display = 'block';
                generateBtn.disabled = false;
            };

            resultImg.onerror = function() {
                loadingText.classList.add('error-text');
                loadingText.textContent = '画像の生成に失敗しました。もう一度お試しください。';
                generateBtn.disabled = false;
            };

            resultImg.src = imageUrl;
        }

        // ================= 動画生成機能 =================
        let currentVideoType = 'video'; // 'video' または 'image'

        function generateVideo() {
            const promptInput = document.getElementById('video-prompt');
            const promptText = promptInput.value.trim();
            const generateBtn = document.getElementById('generate-video-btn');
            const downloadBtn = document.getElementById('download-video-btn');
            const loadingText = document.getElementById('loading-video');
            const resultVideo = document.getElementById('result-video');
            const resultVideoImg = document.getElementById('result-video-img');

            if (!promptText) {
                alert('プロンプトを入力してください。');
                return;
            }

            generateBtn.disabled = true;
            resultVideo.style.display = 'none';
            resultVideoImg.style.display = 'none';
            downloadBtn.style.display = 'none';

            resultVideo.pause();
            resultVideo.removeAttribute('src');
            resultVideo.load();

            loadingText.classList.remove('error-text');
            loadingText.innerHTML = '動画を生成中...<br>（サーバー接続中...）';
            loadingText.style.display = 'block';

            const enhancedPrompt = translateOrEnhancePrompt(promptText);
            const encodedPrompt = encodeURIComponent(enhancedPrompt);
            const randomSeed = Math.floor(Math.random() * 1000000);

            // まずMP4形式での生成を試みる
            const videoUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&model=video&seed=${randomSeed}`;

            let hasLoaded = false;

            resultVideo.oncanplay = function() {
                if (hasLoaded) return;
                hasLoaded = true;
                currentVideoType = 'video';
                loadingText.style.display = 'none';
                resultVideo.style.display = 'block';
                downloadBtn.style.display = 'block';
                generateBtn.disabled = false;
                resultVideo.play().catch(e => console.log(e));
            };

            // MP4生成に失敗した場合、アニメーション風GIF/画像にフォールバック
            resultVideo.onerror = function() {
                if (hasLoaded) return;
                console.warn("動画モデルの読み込みに失敗しました。フォールバック処理を実行します。");
                
                loadingText.innerHTML = '動画サーバー高負荷のため、代替生成を適用中...';
                
                // 動的アニメーション画像（モデル変更フォールバック）
                const fallbackUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}%20gif%20animation?width=512&height=512&model=flux&nologo=true&seed=${randomSeed}`;
                
                resultVideoImg.onload = function() {
                    hasLoaded = true;
                    currentVideoType = 'image';
                    loadingText.style.display = 'none';
                    resultVideoImg.style.display = 'block';
                    downloadBtn.style.display = 'block';
                    generateBtn.disabled = false;
                };

                resultVideoImg.onerror = function() {
                    loadingText.classList.add('error-text');
                    loadingText.innerHTML = '生成に失敗しました。<br>英語で「Sans undertale video」のように入力して再度お試しください。';
                    generateBtn.disabled = false;
                };

                resultVideoImg.src = fallbackUrl;
            };

            resultVideo.src = videoUrl;
        }

        function downloadVideoHandler() {
            if (currentVideoType === 'video') {
                downloadMedia('result-video', 'ai-video', 'mp4');
            } else {
                downloadMedia('result-video-img', 'ai-animation', 'jpg');
            }
        }

        // ================= メディア保存（ダウンロード）共通機能 =================
        async function downloadMedia(elementId, filePrefix, extension) {
            const mediaEl = document.getElementById(elementId);
            const downloadBtn = document.getElementById(elementId === 'result-image' ? 'download-btn' : 'download-video-btn');
            const src = mediaEl.src;

            if (!src) return;

            try {
                downloadBtn.disabled = true;
                downloadBtn.textContent = 'ダウンロード中...';

                const response = await fetch(src);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${filePrefix}-${Date.now()}.${extension}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                alert('ファイルのダウンロードに失敗しました。');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = '保存する';
            }
        }

        // ================= AIチャット機能 =================
        const chatMessages = [
            { role: 'system', content: 'あなたは親切で分かりやすい日本語のAIアシスタントです。' }
        ];

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');

            if (!text) return;

            appendMessage('user', text);
            chatMessages.push({ role: 'user', content: text });
            input.value = '';

            sendBtn.disabled = true;
            const loadingMsg = appendMessage('bot', '回答を作成中...');

            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatMessages,
                        model: 'openai'
                    })
                });

                if (!response.ok) throw new Error('API通信エラー');

                const replyText = await response.text();

                loadingMsg.textContent = replyText;
                chatMessages.push({ role: 'assistant', content: replyText });

            } catch (error) {
                console.error(error);
                loadingMsg.textContent = '申し訳ありません。回答の取得に失敗しました。';
                loadingMsg.classList.add('system-error');
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function appendMessage(role, text) {
            const chatBox = document.getElementById('chat-box');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            msgEl.textContent = text;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgEl;
        }
    </script>

</body>
</html>
